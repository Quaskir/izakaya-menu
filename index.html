<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --header-h: 60px;
      --nav-h: 52px;
      --red: #c0392b;
      --red-light: #e74c3c;
      --gold: #c9a84c;
      --gold-light: #f0c96a;
      --bg: #0a0a0f;
      --card: rgba(255,255,255,0.04);
      --text: #f0ece4;
      --text2: rgba(240,236,228,0.5);
      --border: rgba(201,168,76,0.15);
      --shadow: rgba(192,57,43,0.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse 60% 50% at 10% 10%, rgba(192,57,43,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 90% 30%, rgba(201,168,76,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(192,57,43,0.1) 0%, transparent 60%),
        #0a0a0f;
      background-attachment: fixed;
    }

    .orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(90px); }
    .orb-1 { width: 450px; height: 350px; background: rgba(192,57,43,0.14); top: -80px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(201,168,76,0.08); top: 35%; right: -120px; }
    .orb-3 { width: 350px; height: 350px; background: rgba(192,57,43,0.1); bottom: -80px; left: 30%; }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-bottom: 1.5px solid rgba(201,168,76,0.45);
      box-shadow: 0 1px 0 rgba(201,168,76,0.15), 0 4px 24px rgba(0,0,0,0.5);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: var(--header-h); padding: 0 20px;
    }
    .header-logo img { height: 56px; width: auto; display: block; filter: brightness(0) invert(1); }
    .header-logo-text {
      font-size: 22px; font-weight: 800; letter-spacing: 0.12em;
      color: var(--text);
      display: flex; flex-direction: column; line-height: 1.1;
    }
    .header-logo-sub { font-size: 9px; font-weight: 400; letter-spacing: 0.2em; color: var(--gold); opacity: 0.8; }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .search-btn {
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 50%; width: 36px; height: 36px;
      cursor: pointer; color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .search-btn:hover { background: rgba(201,168,76,0.15); }
    .search-btn svg { width: 17px; height: 17px; }

    .lang-switcher {
      display: flex; background: rgba(201,168,76,0.06);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 22px; padding: 3px; gap: 1px;
    }
    .lang-btn {
      border: none; background: none; cursor: pointer;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 18px;
      color: rgba(201,168,76,0.45); transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .lang-btn.active { background: var(--gold); color: #0a0a0f; box-shadow: 0 2px 8px rgba(201,168,76,0.35); }

    /* ── SEARCH BAR ── */
    .search-bar { display: none; padding: 8px 20px 14px; }
    .search-bar.visible { display: block; }
    .search-bar input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(201,168,76,0.2);
      border-radius: 14px; padding: 11px 18px;
      font-size: 15px; color: var(--text); outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input::placeholder { color: var(--text2); }
    .search-bar input:focus { border-color: var(--gold); }

    /* ── CATEGORY NAV ── */
    #categoryNav {
      position: sticky; top: var(--header-h); z-index: 99;
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-bottom: 1px solid var(--border);
      overflow-x: auto; white-space: nowrap;
      height: var(--nav-h); display: flex;
      align-items: center; padding: 0 14px; gap: 6px;
      scrollbar-width: none;
    }
    #categoryNav::-webkit-scrollbar { display: none; }

    .cat-btn {
      border: 1.5px solid rgba(201,168,76,0.2);
      background: rgba(255,255,255,0.04);
      cursor: pointer; font-size: 12px; font-weight: 600;
      padding: 6px 14px; border-radius: 20px;
      color: var(--text2); white-space: nowrap;
      transition: all 0.18s; flex-shrink: 0;
    }
    .cat-btn.active {
      background: var(--red); border-color: var(--red);
      color: #fff; box-shadow: 0 3px 10px rgba(192,57,43,0.4);
    }

    /* ── MAIN ── */
    main { position: relative; z-index: 1; padding: 12px 0 100px; }

    /* ── CATEGORY SECTION ── */
    .cat-section { padding: 20px 14px 6px; }
    .cat-section.hidden { display: none; }
    .cat-title {
      font-size: 13px; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold); opacity: 1;
      margin-bottom: 8px; padding-left: 4px;
    }
    .cat-subtitle {
      font-size: 10px; color: var(--text2);
      margin-bottom: 8px; padding-left: 4px;
      letter-spacing: 0.05em;
    }

    /* ── ITEMS LIST ── */
    .items-list {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(201,168,76,0.12);
    }

    .item-card {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 18px; gap: 14px;
      border-bottom: 1px solid rgba(201,168,76,0.07);
      transition: background 0.15s;
    }
    .item-card:last-child { border-bottom: none; }
    .item-card:active { background: rgba(201,168,76,0.05); }
    .item-card.hidden { display: none; }

    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 14px; font-weight: 400; color: var(--text); line-height: 1.35; }
    .item-desc { font-size: 11px; color: var(--gold); opacity: 0.6; line-height: 1.4; margin-top: 2px; font-style: italic; }
    .item-right { display: flex; flex-direction: row; align-items: center; gap: 10px; flex-shrink: 0; }
    .item-price {
      font-size: 13px; font-weight: 600; color: var(--gold);
      white-space: nowrap;
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 10px; padding: 3px 10px;
    }

    /* ── ADD BUTTON ── */
    .add-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--red); border: none; cursor: pointer;
      color: #fff; font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(192,57,43,0.4);
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .add-btn:active { transform: scale(0.88); }
    .add-btn.in-cart { background: var(--gold); }

    /* ── CART FAB ── */
    .cart-fab {
      position: fixed; bottom: 24px; right: 20px; z-index: 200;
      background: var(--red); border: none;
      border-radius: 50px; padding: 0 20px 0 16px; height: 52px;
      display: none; align-items: center; gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(192,57,43,0.5);
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .cart-fab.visible { display: flex; }
    .cart-fab:active { transform: scale(0.96); }
    .cart-fab-icon { font-size: 20px; }
    .cart-fab-info { display: flex; flex-direction: column; align-items: flex-start; }
    .cart-fab-count { font-size: 11px; color: rgba(255,255,255,0.75); line-height: 1; }
    .cart-fab-total { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; }

    /* ── CART DRAWER ── */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .cart-overlay.open { opacity: 1; pointer-events: auto; }

    .cart-drawer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 301;
      background: #12100f;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(201,168,76,0.2);
      max-height: 80vh; display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .cart-drawer.open { transform: translateY(0); }

    .cart-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
    }
    .cart-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 12px; flex-shrink: 0;
      border-bottom: 1px solid rgba(201,168,76,0.1);
    }
    .cart-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .cart-clear {
      font-size: 13px; color: var(--text2);
      background: none; border: none; cursor: pointer; padding: 4px 8px;
    }
    .cart-items { overflow-y: auto; flex: 1; padding: 8px 0; }
    .cart-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(201,168,76,0.07);
    }
    .cart-row:last-child { border-bottom: none; }
    .cart-row-info { flex: 1; min-width: 0; }
    .cart-row-name { font-size: 14px; color: var(--text); line-height: 1.3; }
    .cart-row-price { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .cart-qty { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(201,168,76,0.07);
      color: var(--gold); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .qty-btn:active { background: rgba(201,168,76,0.15); }
    .qty-num { font-size: 15px; font-weight: 600; min-width: 20px; text-align: center; color: var(--text); }
    .cart-footer {
      padding: 16px 20px 28px; flex-shrink: 0;
      border-top: 1px solid rgba(201,168,76,0.1);
    }
    .cart-total-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .cart-total-label { font-size: 14px; color: var(--text2); }
    .cart-total-amount { font-size: 22px; font-weight: 700; color: var(--gold); }

    @media (min-width: 640px) {
      .cart-drawer { max-width: 480px; left: 50%; transform: translateX(-50%) translateY(100%); right: auto; border-radius: 20px 20px 0 0; }
      .cart-drawer.open { transform: translateX(-50%) translateY(0); }
    }

    /* ── EMPTY STATE ── */
    .empty-state { display: none; text-align: center; padding: 80px 20px; color: var(--text2); }
    .empty-state.visible { display: block; }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state-text { font-size: 15px; font-weight: 500; }

    @media (min-width: 640px) {
      .cat-section { padding: 24px 24px 8px; max-width: 680px; margin: 0 auto; }
    }
  </style>
</head>

// ─────────────────────────────
//  STATE
// ─────────────────────────────
let currentLang = 'ru';
let searchQuery = '';
let cart = [];

// ─────────────────────────────
//  INIT
// ─────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildCategoryNav();
  renderMenu();
  initSearch();
  initLang();
  initScrollSpy();
  initCart();
});

// ─────────────────────────────
//  HELPERS
// ─────────────────────────────
function getCatName(cat) {
  if (currentLang === 'kz') return cat.name_kz || cat.name;
  if (currentLang === 'en') return cat.name_en || cat.name;
  return cat.name;
}
function getItemName(item) {
  if (currentLang === 'kz') return item.name_kz || item.name;
  if (currentLang === 'en') return item.name_en || item.name;
  return item.name;
}
function formatPrice(price) {
  return price.toLocaleString('ru-RU') + ' тг';
}

// ─────────────────────────────
//  CATEGORY NAV
// ─────────────────────────────
function buildCategoryNav() {
  const nav = document.getElementById('categoryNav');
  menuData.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (i === 0 ? ' active' : '');
    btn.textContent = getCatName(cat);
    btn.dataset.id = cat.id;
    btn.onclick = () => scrollToCategory(cat.id);
    nav.appendChild(btn);
  });
}

function scrollToCategory(id) {
  const el = document.getElementById('cat-' + id);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 60 - 52 - 12;
  window.scrollTo({ top, behavior: 'smooth' });
}

function buildCategoryNavLabels() {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    const cat = menuData.find(c => c.id === btn.dataset.id);
    if (cat) btn.textContent = getCatName(cat);
  });
}

function initScrollSpy() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id.replace('cat-', '');
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
        const activeBtn = document.querySelector(`.cat-btn[data-id="${id}"]`);
        if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', inline: 'center' });
      }
    });
  }, { rootMargin: '-100px 0px -60% 0px' });

  menuData.forEach(cat => {
    const el = document.getElementById('cat-' + cat.id);
    if (el) observer.observe(el);
  });
}

// ─────────────────────────────
//  RENDER MENU
// ─────────────────────────────
function renderMenu() {
  const main = document.getElementById('mainContent');
  const emptyState = document.getElementById('emptyState');
  let totalVisible = 0;
  main.querySelectorAll('.cat-section').forEach(el => el.remove());

  menuData.forEach(cat => {
    const items = cat.items.filter(item => matchesSearch(item));
    const section = document.createElement('div');
    section.className = 'cat-section' + (items.length === 0 ? ' hidden' : '');
    section.id = 'cat-' + cat.id;

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.textContent = getCatName(cat);
    section.appendChild(title);

    if (cat.subtitle) {
      const sub = document.createElement('div');
      sub.className = 'cat-subtitle';
      sub.textContent = cat.subtitle;
      section.appendChild(sub);
    }

    const list = document.createElement('div');
    list.className = 'items-list';

    items.forEach(item => {
      totalVisible++;
      const card = document.createElement('div');
      card.className = 'item-card';
      const inCart = cart.some(e => e.key === item.name);
      const rightHtml = `
        <div class="item-right">
          <div class="item-price">${formatPrice(item.price)}</div>
          <button class="add-btn${inCart ? ' in-cart' : ''}" data-name="${item.name}" data-price="${item.price}">+</button>
        </div>`;
      card.innerHTML = `
        <div class="item-info">
          <div class="item-name">${getItemName(item)}</div>
          ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
        </div>
        ${rightHtml}`;
      list.appendChild(card);
    });

    section.appendChild(list);
    main.insertBefore(section, emptyState);
  });

  emptyState.classList.toggle('visible', totalVisible === 0);
}

function matchesSearch(item) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return item.name.toLowerCase().includes(q) ||
    (item.name_kz || '').toLowerCase().includes(q) ||
    (item.name_en || '').toLowerCase().includes(q) ||
    (item.desc || '').toLowerCase().includes(q);
}

// ─────────────────────────────
//  SEARCH
// ─────────────────────────────
function initSearch() {
  document.getElementById('searchToggle').addEventListener('click', () => {
    const bar = document.getElementById('searchBar');
    bar.classList.toggle('visible');
    if (bar.classList.contains('visible')) document.getElementById('searchInput').focus();
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderMenu();
  });
}

// ─────────────────────────────
//  LANGUAGE
// ─────────────────────────────
function initLang() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('searchInput').placeholder =
        currentLang === 'en' ? 'Search menu...' : currentLang === 'kz' ? 'Мәзірден іздеу...' : 'Поиск по меню...';
      renderMenu();
      buildCategoryNavLabels();
    });
  });
}

// ─────────────────────────────
//  CART
// ─────────────────────────────
function plural(n, a, b, c) {
  const m = n % 10;
  if (n % 100 >= 11 && n % 100 <= 14) return c;
  if (m === 1) return a; if (m >= 2 && m <= 4) return b; return c;
}
function cartTotal() { return cart.reduce((s, e) => s + e.price * e.qty, 0); }
function cartCount() { return cart.reduce((s, e) => s + e.qty, 0); }

function addToCart(name, price) {
  const existing = cart.find(e => e.key === name);
  if (existing) existing.qty++;
  else cart.push({ key: name, name, price, qty: 1 });
  updateCartUI(); renderMenu();
}

function changeQty(key, delta) {
  const entry = cart.find(e => e.key === key);
  if (!entry) return;
  entry.qty += delta;
  if (entry.qty <= 0) cart = cart.filter(e => e.key !== key);
  updateCartUI(); renderCartItems(); renderMenu();
  if (cart.length === 0) closeCart();
}

function clearCart() {
  cart = []; updateCartUI(); renderMenu(); closeCart();
}

function updateCartUI() {
  const count = cartCount();
  document.getElementById('cartFab').classList.toggle('visible', count > 0);
  document.getElementById('cartFabCount').textContent = count + ' ' + plural(count, 'позиция', 'позиции', 'позиций');
  document.getElementById('cartFabTotal').textContent = cartTotal().toLocaleString('ru-RU') + ' тг';
}

function renderCartItems() {
  document.getElementById('cartItems').innerHTML = cart.map(e => `
    <div class="cart-row">
      <div class="cart-row-info">
        <div class="cart-row-name">${e.name}</div>
        <div class="cart-row-price">${(e.price * e.qty).toLocaleString('ru-RU')} тг</div>
      </div>
      <div class="cart-qty">
        <button class="qty-btn" onclick="changeQty('${e.key.replace(/'/g,"\\'")}', -1)">−</button>
        <span class="qty-num">${e.qty}</span>
        <button class="qty-btn" onclick="changeQty('${e.key.replace(/'/g,"\\'")}', 1)">+</button>
      </div>
    </div>`).join('');
  document.getElementById('cartTotalAmount').textContent = cartTotal().toLocaleString('ru-RU') + ' тг';
}

function openCart() { renderCartItems(); document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartDrawer').classList.add('open'); }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartDrawer').classList.remove('open'); }

function initCart() {
  document.getElementById('mainContent').addEventListener('click', (e) => {
    const addBtn = e.target.closest('.add-btn');
    if (addBtn) addToCart(addBtn.dataset.name, Number(addBtn.dataset.price));
  });
}
