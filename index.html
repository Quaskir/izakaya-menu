  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --night: #121A2C;        /* индиго норэна ночью */
      --indigo: #1B2640;       /* панели и шторки */
      --indigo-2: #26324F;
      --paper: #EFE6D3;        /* рисовая бумага */
      --muted: #9AA3B9;
      --lantern: #D7262B;      /* красный фонарь = красный логотипа */
      --lantern-text: #F2734A; /* тот же свет, читаемый мелким текстом */
      --hairline: rgba(239,230,211,0.12);
      --top-h: 48px;
      --tabs-h: 48px;
      --bar-h: calc(var(--top-h) + var(--tabs-h));
      --mincho: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      --body: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--body);
      background: var(--night);
      color: var(--paper);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; border-radius: 6px; }

    /* ── HERO: красный фонарь идзакаи ── */
    .hero {
      position: relative; overflow: hidden; text-align: center;
      padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 26px;
    }
    .hero-top { position: relative; z-index: 2; display: flex; justify-content: flex-end; max-width: 640px; margin: 0 auto; }
    .lang { display: flex; gap: 2px; }
    .lang-btn {
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
      padding: 8px; color: var(--muted); position: relative;
    }
    .lang-btn.active { color: var(--paper); }
    .lang-btn.active::after {
      content: ''; position: absolute; left: 8px; right: 8px; bottom: 4px;
      height: 1.5px; background: var(--lantern-text);
    }
    .glow {
      position: absolute; left: 50%; top: 10px; width: 340px; height: 340px; margin-left: -170px;
      background: radial-gradient(circle, rgba(255,110,60,0.30) 0%, rgba(215,38,43,0.10) 40%, transparent 68%);
      pointer-events: none;
    }
    .lantern-wrap { position: relative; z-index: 1; height: 150px; margin-top: -30px; }
    .lantern {
      width: 92px; height: auto; display: block; margin: 0 auto;
      transform-origin: 50% 0; animation: sway 6s ease-in-out infinite;
    }
    @keyframes sway { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
    .logo { position: relative; z-index: 1; display: block; width: 190px; height: auto; margin: 14px auto 0; }
    .kicker {
      position: relative; z-index: 1; margin-top: 10px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted);
    }

    /* ── STICKY BAR ── */
    .bar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(27,38,64,0.96);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
    }
    .bar-top, .bar-tabs { max-width: 640px; margin: 0 auto; display: flex; align-items: stretch; }
    .bar-top { height: var(--top-h); padding: 0 4px; gap: 4px; align-items: center; }
    .bar-tabs { height: var(--tabs-h); border-top: 1px solid var(--hairline); }
    .icon-btn {
      flex-shrink: 0; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center; color: var(--paper);
    }
    .icon-btn svg { width: 19px; height: 19px; }

    .segment {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; height: 36px; padding: 3px;
      border-radius: 10px; background: rgba(0,0,0,0.25);
    }
    .seg-btn { border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background 0.2s, color 0.2s; }
    .seg-btn.active { background: var(--paper); color: var(--night); }

    .tabs {
      flex: 1; display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 22px 0 8px;
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; white-space: nowrap; padding: 0 10px;
      font-size: 14px; font-weight: 500; color: var(--muted); position: relative;
    }
    .tab::after {
      content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
      background: var(--lantern-text); transform: scaleX(0); transition: transform 0.25s ease;
    }
    .tab.active { color: var(--paper); }
    .tab.active::after { transform: scaleX(1); }

    .search { flex: 1; display: none; align-items: center; }
    .search input {
      flex: 1; min-width: 0; height: 100%; border: none; background: none; outline: none;
      font: inherit; font-size: 16px; color: var(--paper); padding: 0 4px 0 10px;
    }
    .search input::placeholder { color: var(--muted); }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .bar.searching .segment, .bar.searching #searchOpen, .bar.searching #navOpen, .bar.searching .bar-tabs { display: none; }
    .bar.searching .search { display: flex; }

    /* ── MENU ── */
    main { max-width: 640px; margin: 0 auto; padding: 4px 16px 0; }
    .grp { padding-top: 40px; scroll-margin-top: calc(var(--bar-h) + 4px); }
    .grp.hidden { display: none; }

    /* табличка о-синагаки: как меню на деревянной стене идзакаи */
    .grp-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 8px; }
    .tag {
      position: relative; flex: 0 0 34px; margin-top: 6px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 10px 0 8px; border-radius: 3px;
      background: var(--paper); color: #1A1F2E;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }
    .tag::before {
      content: ''; position: absolute; top: -9px; left: 50%; width: 6px; height: 6px; margin-left: -3px;
      border-radius: 50%; background: var(--muted);
    }
    .tag-kanji { writing-mode: vertical-rl; font-family: var(--mincho); font-weight: 600; font-size: 17px; letter-spacing: 0.12em; line-height: 1; }
    .tag-seal { width: 11px; height: 11px; border-radius: 2px; background: var(--lantern); }
    .grp-titles { flex: 1; min-width: 0; padding-top: 4px; }
    .grp-name { font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
    .grp-meta { margin-top: 6px; font-size: 13px; color: var(--muted); }

    .sub-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin-top: 26px; padding-bottom: 8px; border-bottom: 1px solid rgba(242,115,74,0.45);
    }
    .sub-name { font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lantern-text); }
    .sub-portion { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

    .items { list-style: none; }
    .dish { padding: 15px 0 14px; border-bottom: 1px solid var(--hairline); }
    .dish:last-child { border-bottom: none; }
    .dish.drink { padding: 12px 0 11px; }
    /* Блюдо с фото — фото слева, справа название, описание, внизу цена и «+»: 4–5 блюд на экран (11.11.2026).
       Крупное фото — по нажатию (окно просмотра). */
    .dish.with-photo { display: flex; gap: 14px; padding: 14px 0; }
    .dish-photo {
      display: block; flex: 0 0 auto; width: 118px; height: 118px;
      border-radius: 12px; overflow: hidden; background: var(--indigo);
    }
    .dish-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .dish-body { flex: 1 1 auto; min-width: 0; min-height: 118px; display: flex; flex-direction: column; text-align: left; cursor: pointer; }
    .dish-body .dish-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .dish-body .dish-desc {
      margin-top: 4px; padding-right: 0; font-size: 13px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .dish-foot { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; }
    .dish-foot .add { margin: 0; }
    @media (min-width: 480px) {
      .dish-photo { width: 132px; height: 132px; }
      .dish-body { min-height: 132px; }
    }
    .dish-line { display: flex; align-items: flex-end; }
    .dish-name { flex: 0 1 auto; font-size: 16.5px; font-weight: 500; line-height: 1.35; }
    .drink .dish-name { font-size: 15.5px; }
    .leader { flex: 1 1 16px; min-width: 16px; margin: 0 8px 6px; border-bottom: 1.5px dotted rgba(239,230,211,0.28); }
    .dish-price { flex-shrink: 0; font-size: 16px; font-weight: 600; line-height: 1.35; font-variant-numeric: tabular-nums; }
    .dish-price small { margin-left: 2px; font-size: 13px; font-weight: 500; color: var(--muted); }
    .dish-desc { margin-top: 5px; padding-right: 48px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
    .drink .dish-desc { margin-top: 2px; font-size: 13px; }

    .add {
      flex-shrink: 0; position: relative;
      width: 32px; height: 32px; margin: 0 0 -4px 12px; border-radius: 50%;
      border: 1.5px solid rgba(239,230,211,0.55); color: var(--paper);
      font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .add::before { content: ''; position: absolute; inset: -8px; }
    .add svg { width: 14px; height: 14px; }
    .add.in-cart { background: var(--lantern); border-color: var(--lantern); color: #fff; }
    .add.pop { animation: pop 0.28s ease; }
    @keyframes pop { 40% { transform: scale(1.18); } }

    .empty { display: none; text-align: center; padding: 72px 20px 24px; }
    .empty.visible { display: block; }
    .empty-title { font-size: 22px; font-weight: 600; }
    .empty-text { margin-top: 8px; font-size: 14px; color: var(--muted); }

    footer { max-width: 640px; margin: 56px auto 0; padding: 0 16px 140px; text-align: center; }
    .kampai { font-family: var(--mincho); font-weight: 600; font-size: 40px; letter-spacing: 0.2em; color: var(--lantern-text); }
    .kampai-text { margin-top: 8px; font-size: 14px; color: var(--muted); }

    /* ── CART BAR ── */
    .cart-bar {
      position: fixed; z-index: 60; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      max-width: 608px; margin: 0 auto; height: 56px; padding: 0 18px 0 12px;
      display: flex; align-items: center; gap: 12px;
      background: var(--lantern); color: #fff; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(215,38,43,0.35);
      transform: translateY(calc(100% + 40px)); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .cart-bar.visible { transform: none; }
    .cart-count {
      min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px;
      background: var(--paper); color: var(--night); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-label { flex: 1; text-align: left; font-size: 15px; font-weight: 500; }
    .cart-sum { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ── SHEETS ── */
    .overlay {
      position: fixed; inset: 0; z-index: 70; background: rgba(5,8,16,0.6);
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet, .nav-sheet {
      position: fixed; z-index: 71; left: 0; right: 0; bottom: 0;
      max-width: 640px; margin: 0 auto; max-height: 85vh;
      background: var(--indigo); border-radius: 20px 20px 0 0;
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .sheet.open, .nav-sheet.open { transform: none; }
    .sheet { display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .sheet-band { height: 6px; width: 40px; margin: 10px auto 0; border-radius: 3px; background: var(--indigo-2); }
    .sheet-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--hairline); }
    .sheet-title { font-size: 24px; font-weight: 600; }
    .sheet-clear { font-size: 14px; color: var(--muted); padding: 6px 0 6px 12px; }
    .sheet-items { overflow-y: auto; flex: 1; padding: 0 20px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--hairline); }
    .row:last-child { border-bottom: none; }
    .row-info { flex: 1; min-width: 0; }
    .row-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
    .row-price { margin-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .qty { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .qty-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--indigo-2); font-size: 18px; line-height: 1; }
    .qty-btn:active { background: var(--indigo-2); }
    .qty-num { min-width: 24px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sheet-foot { padding: 16px 20px 20px; border-top: 1px solid var(--hairline); }
    .total { display: flex; align-items: baseline; justify-content: space-between; }
    .total-label { font-size: 14px; color: var(--muted); }
    .total-sum { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .show-btn {
      width: 100%; margin-top: 16px; height: 54px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--paper); color: var(--night); font-size: 16px; font-weight: 600;
    }
    .show-btn svg { width: 20px; height: 20px; }
    .show-hint { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; }

    .nav-sheet { overflow-y: auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
    .nav-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 4px; }
    .nav-title { font-size: 24px; font-weight: 600; }
    .nav-close { width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .nav-close svg { width: 20px; height: 20px; }
    .nav-section { margin: 16px 0 8px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lantern-text); }
    .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .nav-item {
      text-align: left; min-height: 68px; padding: 11px 13px; border-radius: 14px;
      background: var(--night); border: 1px solid var(--hairline);
      display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    }
    .nav-item-name { font-size: 15px; font-weight: 600; line-height: 1.25; }
    .nav-item-count { font-size: 12.5px; color: var(--muted); }
    .nav-item.active { background: var(--paper); border-color: var(--paper); color: var(--night); }
    .nav-item.active .nav-item-count { color: #4A5168; }

    /* ── PHOTO VIEWER ── */
    .viewer {
      position: fixed; inset: 0; z-index: 80;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(56px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
      background: rgba(8,12,22,0.97); text-align: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .viewer.open { opacity: 1; pointer-events: auto; }
    .viewer:focus { outline: none; }
    .viewer-close {
      position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); right: 6px;
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    }
    .viewer-close svg { width: 22px; height: 22px; }
    .viewer img { display: block; max-width: min(100%, 560px); max-height: 52vh; border-radius: 16px; object-fit: contain; }
    .viewer-name { margin-top: 20px; font-size: 24px; font-weight: 600; line-height: 1.2; max-width: 520px; }
    .viewer-desc { margin-top: 8px; max-width: 480px; font-size: 14px; line-height: 1.5; color: var(--muted); }
    .viewer-desc:empty { display: none; }
    .viewer-price { margin-top: 6px; font-size: 16px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
    .viewer-add {
      margin-top: 20px; height: 50px; padding: 0 28px; border-radius: 14px;
      background: var(--paper); color: var(--night); font-size: 15px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .viewer-add .cnt {
      min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px;
      background: var(--lantern); color: #fff; font-size: 13px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* ── WAITER SCREEN: светлый, по-русски, крупно ── */
    .waiter {
      position: fixed; inset: 0; z-index: 90; overflow-y: auto;
      background: var(--paper); color: #141A2A;
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .waiter.open { transform: none; }
    .waiter-band { height: calc(8px + env(safe-area-inset-top, 0px)); background: var(--lantern); }
    .waiter-inner { max-width: 640px; margin: 0 auto; padding: 8px 20px calc(28px + env(safe-area-inset-bottom, 0px)); }
    .waiter-back { display: inline-flex; align-items: center; gap: 4px; height: 44px; margin-left: -6px; padding: 0 6px; font-size: 15px; font-weight: 500; color: #9E1A1E; }
    .waiter-back svg { width: 18px; height: 18px; }
    .waiter :focus-visible { outline-color: #141A2A; }
    .waiter-title { margin-top: 6px; font-size: 34px; font-weight: 600; }
    .waiter-sub { margin-top: 2px; font-size: 15px; color: #5A6075; }
    .waiter-group { margin-top: 22px; padding-bottom: 6px; border-bottom: 1.5px solid var(--lantern); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9E1A1E; }
    .waiter-row { display: flex; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(20,26,42,0.12); }
    .waiter-qty { flex-shrink: 0; min-width: 40px; font-size: 22px; font-weight: 600; color: #9E1A1E; font-variant-numeric: tabular-nums; }
    .waiter-name { flex: 1; font-size: 20px; font-weight: 500; line-height: 1.3; }
    .waiter-sum { flex-shrink: 0; font-size: 17px; font-weight: 500; color: #5A6075; font-variant-numeric: tabular-nums; }

function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch (e) { return null; }
}

// ─────────────────────────────
//  NAMES
// ─────────────────────────────
function localName(obj) {
  if (currentLang === 'kz') return obj.name_kz || obj.name;
  if (currentLang === 'en') return obj.name_en || obj.name;
  return obj.name;
}
const groupName = (g) => g.name ? localName(g) : localName(catById[g.cats[0]]);
const groupCats = (g) => g.cats.filter(id => catById[id] && !HIDDEN_CATS.includes(id)).map(id => catById[id]);
const groupCount = (g) => groupCats(g).reduce((s, c) => s + c.items.length, 0);

function formatNum(n) { return n.toLocaleString('ru-RU'); }
function formatPrice(n) { return formatNum(n) + ' ₸'; }
function portion(s) { return (s || '').replace(/(\d)\s*ml\b/i, '$1 мл').replace(/(\d)\s*шт\b/, '$1 шт'); }

function plural(n, a, b, c) {
  const m = Math.abs(n) % 100, m1 = m % 10;
  if (m > 10 && m < 20) return c;
  if (m1 > 1 && m1 < 5) return b;
  if (m1 === 1) return a;
  return c;
}
function countLabel(n) {
  if (currentLang === 'en') return n + (n === 1 ? ' item' : ' items');
  if (currentLang === 'kz') return n + ' позиция';
  return n + ' ' + plural(n, 'позиция', 'позиции', 'позиций');
}

// ─────────────────────────────
//  KITCHEN / BAR
// ─────────────────────────────
function initSections() {
  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => switchSection(btn.dataset.section, true));
  });
}

function switchSection(section, toTop) {
  if (section === currentSection) return;
  currentSection = section;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.section === section));
  renderMenu();
  // к началу меню, если ушли ниже
  const barTop = $('bar').getBoundingClientRect().top + window.scrollY;
  if (toTop && window.scrollY > barTop) window.scrollTo({ top: barTop });
}

// ─────────────────────────────
//  TABS + ACTIVE GROUP
// ─────────────────────────────
function buildTabs() {
  const tabs = $('tabs');
  tabs.innerHTML = '';
  GROUPS.filter(g => g.section === currentSection && groupCount(g)).forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = groupName(g);
    btn.dataset.id = g.id;
    btn.onclick = () => jumpTo(g.id);
    tabs.appendChild(btn);
  });
}

function setActiveTab(id) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  const btn = document.querySelector(`.tab[data-id="${id}"]`);
  const tabs = $('tabs');
  if (!btn) return;
  const b = btn.getBoundingClientRect(), r = tabs.getBoundingClientRect();
  tabs.scrollTo({ left: tabs.scrollLeft + b.left - r.left - r.width / 2 + b.width / 2, behavior: 'smooth' });
}

// активная группа — последняя, чей верх ушёл под липкую панель; внизу страницы — последняя
let activeGroup = null;
function updateActiveTab() {
  if (navLock) return;
  const groups = [...document.querySelectorAll('.grp:not(.hidden)')];
  if (!groups.length) return;
  const line = $('bar').offsetHeight + 8;
  const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
  let current = groups[0];
  if (atBottom) current = groups[groups.length - 1];
  else groups.forEach(el => { if (el.getBoundingClientRect().top <= line) current = el; });
  const id = current.id.replace('grp-', '');
  if (id !== activeGroup) { activeGroup = id; setActiveTab(id); }
}

// переход: вкладка сразу на цели, без «пробегания» промежуточных
let navLock = false, lockTimer = null;
function releaseLockSoon(ms) {
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => { navLock = false; }, ms);
}
function jumpTo(id) {
  const g = GROUPS.find(x => x.id === id);
  if (g && g.section !== currentSection) switchSection(g.section, false);
  const el = $('grp-' + id);
  if (!el) return;
  navLock = true;
  activeGroup = id;
  setActiveTab(id);
  el.scrollIntoView({ block: 'start', behavior: smoothScroll() });
  releaseLockSoon(500);
}
function onScroll() {
  if (navLock) releaseLockSoon(150);
  else updateActiveTab();
}

    const grid = document.createElement('div');
    grid.className = 'nav-grid';
    GROUPS.filter(g => g.section === section && groupCount(g)).forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (g.id === activeGroup && section === currentSection ? ' active' : '');
      btn.innerHTML = `<span class="nav-item-name">${groupName(g)}</span><span class="nav-item-count">${countLabel(groupCount(g))}</span>`;
      btn.onclick = () => { closeNav(); jumpTo(g.id); };
      grid.appendChild(btn);
    });
    body.appendChild(grid);
  });
  $('overlay').classList.add('open');
  $('navSheet').classList.add('open');
}

function closeNav() {
  $('navSheet').classList.remove('open');
  if (!$('sheet').classList.contains('open')) $('overlay').classList.remove('open');
}

// ─────────────────────────────
//  RENDER MENU
// ─────────────────────────────
const PLUS = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 1.5v11M1.5 7h11"/></svg>';

function renderMenu() {
  const main = $('menu');
  const empty = $('empty');
  let totalVisible = 0;
  main.querySelectorAll('.grp').forEach(el => el.remove());

  // при поиске — по всему меню, иначе только кухня или бар
  GROUPS.filter(g => searchQuery || g.section === currentSection).forEach(g => {
    const cats = groupCats(g)
      .map(cat => ({ cat, items: cat.items.map((item, idx) => ({ item, idx })).filter(({ item }) => matchesSearch(item, cat, g)) }))
      .filter(c => c.items.length);
    const section = document.createElement('section');
    section.className = 'grp' + (cats.length ? '' : ' hidden');
    section.id = 'grp-' + g.id;
    const single = groupCats(g).length === 1;
    const meta = single && groupCats(g)[0].subtitle ? portion(groupCats(g)[0].subtitle) : countLabel(groupCount(g));
    section.innerHTML = `
      <header class="grp-head">
        <div class="tag" aria-hidden="true"><span class="tag-kanji" lang="ja">${g.kanji}</span><span class="tag-seal"></span></div>
        <div class="grp-titles"><h2 class="grp-name">${groupName(g)}</h2><div class="grp-meta">${meta}</div></div>
      </header>`;

    cats.forEach(({ cat, items }) => {
      if (!single) {
        const sub = document.createElement('div');
        sub.className = 'sub-head';
        sub.innerHTML = `<h3 class="sub-name">${localName(cat)}</h3>${cat.subtitle ? `<span class="sub-portion">${portion(cat.subtitle)}</span>` : ''}`;
        section.appendChild(sub);
      }
      const list = document.createElement('ul');
      list.className = 'items';
      items.forEach(({ item, idx }) => {
        totalVisible++;
        const key = cat.id + '_' + idx;
        const photo = g.section === 'kitchen' && item.img;
        const li = document.createElement('li');
        li.className = 'dish' + (photo ? ' with-photo' : '') + (g.section === 'bar' ? ' drink' : '');
        const addBtn = `<button class="add" data-key="${key}" data-name="${item.name}" data-cat="${cat.name}" data-price="${item.price}" aria-label="${t('add')}: ${localName(item)}"></button>`;
        if (photo) {
          li.innerHTML = `
          <button class="dish-photo" data-photo="${item.img}" aria-label="${localName(item)}"><img src="${item.img}" alt="" loading="lazy"></button>
          <div class="dish-body">
            <h4 class="dish-name">${localName(item)}</h4>
            ${item.desc ? `<p class="dish-desc">${item.desc}</p>` : ''}
            <div class="dish-foot">
              <span class="dish-price">${formatNum(item.price)}<small>₸</small></span>
              ${addBtn}
            </div>
          </div>`;
          list.appendChild(li);
          return;
        }
        li.innerHTML = `
          <div class="dish-line">
            <h4 class="dish-name">${localName(item)}</h4>
            <span class="leader" aria-hidden="true"></span>
            <span class="dish-price">${formatNum(item.price)}<small>₸</small></span>
            <button class="add" data-key="${key}" data-name="${item.name}" data-cat="${cat.name}" data-price="${item.price}" aria-label="${t('add')}: ${localName(item)}"></button>
          </div>
          ${item.desc ? `<p class="dish-desc">${item.desc}</p>` : ''}`;
        list.appendChild(li);
      });
      section.appendChild(list);
    });
    main.insertBefore(section, empty);
  });

  empty.classList.toggle('visible', totalVisible === 0);
  buildTabs();
  syncAddButtons();
  activeGroup = null;
  updateActiveTab();
}

function syncAddButtons() {
  document.querySelectorAll('.add').forEach(btn => {
    const entry = cart.find(e => e.key === btn.dataset.key);
    btn.classList.toggle('in-cart', !!entry);
    btn.innerHTML = entry ? entry.qty : PLUS;
  });
}

function matchesSearch(item, cat, g) {
  if (!searchQuery) return true;
  const norm = (x) => (x || '').toLowerCase().replace(/ё/g, 'е');
  // отрезаем окончание: «креветки» находит «креветками», «роллы» — «ролл»
  const q = norm(searchQuery).split(/\s+/).map(w => w.length >= 5 ? w.replace(/[аяыиоеуюьй]$/, '') : w).join(' ');
  return [item.name, item.name_kz, item.name_en, item.desc, cat.name, cat.name_kz, cat.name_en, g.name, g.name_en]
    .some(x => norm(x).includes(q));
}

// ─────────────────────────────
//  SEARCH
// ─────────────────────────────
function initSearch() {
  const bar = $('bar');
  const input = $('searchInput');
  $('searchOpen').addEventListener('click', () => {
    bar.classList.add('searching');
    input.focus();
    const top = bar.getBoundingClientRect().top + window.scrollY;
    if (window.scrollY < top) window.scrollTo({ top });
  });
  $('searchClose').addEventListener('click', () => {
    bar.classList.remove('searching');
    input.value = '';
    searchQuery = '';
    renderMenu();
  });
  input.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderMenu();
  });
}

// ─────────────────────────────
//  LANGUAGE
// ─────────────────────────────
function initLang() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      store('izakaya_lang', currentLang);
      syncLangUI();
      renderMenu();
      updateCartUI();
    });
  });
}

function syncLangUI() {
  document.documentElement.lang = currentLang === 'kz' ? 'kk' : currentLang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('searchInput').placeholder = t('search');
}

// ─────────────────────────────
//  CART
// ─────────────────────────────
function loadCart() {
  try { return JSON.parse(store('izakaya_cart')) || []; } catch (e) { return []; }
}
function saveCart() {
  store('izakaya_cart', JSON.stringify(cart));
}

function addToCart(key, name, price, cat) {
  const existing = cart.find(e => e.key === key);
  if (existing) existing.qty++;
  else cart.push({ key, name, cat, price, qty: 1 });
  saveCart();
  updateCartUI();
}

function changeQty(key, delta) {
  const idx = cart.findIndex(e => e.key === key);
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart();
  updateCartUI();
  renderCartItems();
  if (cart.length === 0) closeCart();
}

function clearCart() {
  cart = [];
  saveCart();
  updateCartUI();
  closeCart();
  closeWaiter();
}

// ключ корзины → блюдо, его раздел, группа и место в меню
function lookup(key) {
  const i = key.lastIndexOf('_');
  const cat = catById[key.slice(0, i)];
  const idx = Number(key.slice(i + 1));
  const item = cat && cat.items[idx];
  if (!item) return null;
  const gi = GROUPS.findIndex(g => g.cats.includes(cat.id));
  const group = GROUPS[gi];
  return { cat, item, group, order: gi * 100000 + (group ? group.cats.indexOf(cat.id) : 0) * 1000 + idx };
}

function openCart() {
  renderCartItems();
  $('overlay').classList.add('open');
  $('sheet').classList.add('open');
}

function closeCart() {
  $('overlay').classList.remove('open');
  $('sheet').classList.remove('open');
}

function updateCartUI() {
  const totalQty = cart.reduce((s, e) => s + e.qty, 0);
  const totalSum = cart.reduce((s, e) => s + e.price * e.qty, 0);
  $('cartCount').textContent = totalQty;
  $('cartSum').textContent = formatPrice(totalSum);
  $('cartBar').classList.toggle('visible', totalQty > 0);
  syncAddButtons();
}

function renderCartItems() {
  const container = $('sheetItems');
  container.innerHTML = '';
  cart.forEach(({ key, name, price, qty }) => {
    const ref = lookup(key);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="row-info">
        <div class="row-name">${ref ? localName(ref.item) : name}</div>
        <div class="row-price">${formatPrice(price)} × ${qty}</div>
      </div>
      <div class="qty">
        <button class="qty-btn" data-key="${key}" data-delta="-1" aria-label="−1">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" data-key="${key}" data-delta="1" aria-label="+1">+</button>
      </div>`;
    container.appendChild(row);
  });
  $('totalSum').textContent = formatPrice(cart.reduce((s, e) => s + e.price * e.qty, 0));
}

// ─────────────────────────────
//  WAITER SCREEN
// ─────────────────────────────
let wakeLock = null;

function openWaiter() {
  const entries = cart
    .map(e => ({ ...e, ref: lookup(e.key) }))
    .sort((a, b) => (a.ref ? a.ref.order : 1e9) - (b.ref ? b.ref.order : 1e9));
  const list = $('waiterList');
  list.innerHTML = '';
  let header = null;
  entries.forEach(e => {
    const title = e.ref ? e.ref.cat.name : e.cat; // по разделам данных: «Роллы», «Нигири», «Виски»
    if (title !== header) {
      header = title;
      const h = document.createElement('div');
      h.className = 'waiter-group';
      h.textContent = title || '';
      list.appendChild(h);
    }
    const row = document.createElement('div');
    row.className = 'waiter-row';
    row.innerHTML = `
      <span class="waiter-qty">${e.qty}×</span>
      <span class="waiter-name">${e.ref ? e.ref.item.name : e.name}</span>
      <span class="waiter-sum">${formatPrice(e.price * e.qty)}</span>`;
    list.appendChild(row);
  });
  const qty = cart.reduce((s, e) => s + e.qty, 0);
  $('waiterSub').textContent = 'Izakaya · ' + qty + ' ' + plural(qty, 'позиция', 'позиции', 'позиций');
  $('waiterTotal').textContent = formatPrice(cart.reduce((s, e) => s + e.price * e.qty, 0));
  $('waiter').classList.add('open');
  $('waiter').scrollTop = 0;
  // экран не гаснет, пока официант записывает
  navigator.wakeLock?.request('screen').then(l => { wakeLock = l; }).catch(() => {});
}

function closeWaiter() {
  $('waiter').classList.remove('open');
  wakeLock?.release().catch(() => {});
  wakeLock = null;
}

// ─────────────────────────────
//  PHOTO VIEWER
// ─────────────────────────────
let viewerBtn = null;

function openViewer(photoBtn) {
  const li = photoBtn.closest('.dish');
  viewerBtn = li.querySelector('.add');
  $('viewerImg').src = photoBtn.dataset.photo;
  $('viewerName').textContent = li.querySelector('.dish-name').textContent;
  $('viewerDesc').textContent = li.querySelector('.dish-desc')?.textContent || '';
  $('viewerPrice').textContent = formatPrice(Number(viewerBtn.dataset.price));
  syncViewerAdd();
  $('viewer').classList.add('open');
  $('viewer').focus({ preventScroll: true });
}

function closeViewer() {
  if (!$('viewer').classList.contains('open')) return;
  $('viewer').classList.remove('open');
  viewerBtn?.closest('.dish')?.querySelector('.dish-photo')?.focus();
  viewerBtn = null;
}

function syncViewerAdd() {
  const entry = viewerBtn && cart.find(e => e.key === viewerBtn.dataset.key);
  $('viewerAdd').innerHTML = `${PLUS.replace('<svg', '<svg width="14" height="14"')} ${t('add')}` +
    (entry ? ` <span class="cnt">${entry.qty}</span>` : '');
}

function initCart() {
  $('menu').addEventListener('click', (e) => {
    const photo = e.target.closest('.dish-photo');
    if (photo) return openViewer(photo);
    const body = !e.target.closest('.add') && e.target.closest('.dish-body');
    if (body) return openViewer(body.closest('.dish').querySelector('.dish-photo'));
    const btn = e.target.closest('.add');
    if (!btn) return;
    addToCart(btn.dataset.key, btn.dataset.name, Number(btn.dataset.price), btn.dataset.cat);
    btn.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('pop');
  });
  $('sheetItems').addEventListener('click', (e) => {
    const btn = e.target.closest('.qty-btn');
    if (btn) changeQty(btn.dataset.key, Number(btn.dataset.delta));
  });
  $('cartBar').addEventListener('click', openCart);
  $('overlay').addEventListener('click', () => { closeCart(); closeNav(); });
  $('clearCart').addEventListener('click', clearCart);
  $('showWaiter').addEventListener('click', openWaiter);
  $('waiterBack').addEventListener('click', closeWaiter);
  $('viewerAdd').addEventListener('click', () => {
    if (!viewerBtn) return;
    addToCart(viewerBtn.dataset.key, viewerBtn.dataset.name, Number(viewerBtn.dataset.price), viewerBtn.dataset.cat);
    syncViewerAdd();
  });
  $('viewerClose').addEventListener('click', closeViewer);
  $('viewer').addEventListener('click', (e) => { if (e.target.id === 'viewer') closeViewer(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('waiter').classList.contains('open')) return closeWaiter();
    closeViewer();
    closeCart();
    closeNav();
  });
}
</script>
